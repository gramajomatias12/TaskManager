<mat-toolbar color="primary">
  <mat-icon>assignment</mat-icon>
  <span style="margin-left: 10px;">Task Manager</span>
  <span style="flex: 1 1 auto;"></span>
  <button mat-button style="background-color: white; color: #3f51b5; font-weight: bold;" (click)="agregarTarea()">
    <mat-icon>add</mat-icon>
    Nueva Tarea
  </button>
</mat-toolbar>

<div class="container" style="padding: 20px; max-width: 900px; margin: auto;">

  <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 20px;">
    <mat-label>Buscar tareas por nombre...</mat-label>
    <input matInput (keyup)="aplicarFiltro($event)" placeholder="Ej. Estudiar">
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" style="width: 100%;">
    
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let t"> {{t.cdTarea}} </td>
    </ng-container>

    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef> Título </th>
      <td mat-cell *matCellDef="let t"> {{t.dsTitulo}} </td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let t"> 
        <span [class]="'badge ' + t.cdEstado">{{t.cdEstado}}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let t">
        <button mat-icon-button color="primary" (click)="editarTarea(t)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminarTarea(t.cdTarea)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['id', 'titulo', 'estado', 'acciones']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['id', 'titulo', 'estado', 'acciones'];"></tr>
  </table>

</div>
