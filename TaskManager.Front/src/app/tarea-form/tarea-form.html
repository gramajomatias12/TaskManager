<h2 mat-dialog-title>{{ isEdit ? 'Editar Tarea' : 'Nueva Tarea' }}</h2>

<mat-dialog-content style="display: flex; flex-direction: column; gap: 15px; padding-top: 10px;">
  
  <mat-form-field appearance="outline">
    <mat-label>Título de la tarea</mat-label>
    <input matInput [formControl]="tituloControl" cdkFocusInitial>
    <mat-error *ngIf="tituloControl.hasError('required')">El título es obligatorio</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Descripción</mat-label>
    <textarea matInput [formControl]="descripcionControl"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Estado</mat-label>
    <mat-select [formControl]="estadoControl">
      <mat-option value="Pendiente">Pendiente</mat-option>
      <mat-option value="En Progreso">En Progreso</mat-option>
      <mat-option value="Completada">Completada</mat-option>
    </mat-select>
  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="tituloControl.invalid" (click)="guardar()">
    {{ isEdit ? 'Actualizar' : 'Guardar' }}
  </button>
</mat-dialog-actions>
